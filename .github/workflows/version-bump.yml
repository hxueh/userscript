name: Version bump

# Greasyfork serves an update to users only when @version changes, so a
# script edited without a bump would sync silently and never reach anyone.
on:
  pull_request:
    paths: ['scripts/*.user.js']
  push:
    branches: [main]
    paths: ['scripts/*.user.js']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a version bump for every changed script
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # First push to a branch has no usable base; nothing to compare.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          ver() { sed -n 's|^// @version[[:space:]]*||p' | head -n1; }
          status=0
          for f in $(git diff --name-only --diff-filter=M "$BASE" HEAD -- 'scripts/*.user.js'); do
            old=$(git show "$BASE:$f" | ver)
            new=$(ver < "$f")
            if [ "$old" = "$new" ]; then
              echo "::error file=$f::changed but @version is still $new"
              status=1
            fi
          done
          exit $status
